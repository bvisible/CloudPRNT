[project]
name = "cloudprnt"
authors = [
    { name = "Neoffice", email = "hello@neoffice.io"}
]
description = "Use CloudPRNT service"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # Standalone CloudPRNT server (supervisor program on port 8001, run with the
    # bench env python) and the MQTT bridge. bench installs from this list only:
    # requirements.txt is not read once a pyproject exists.
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "paho-mqtt>=2.0.0",
    "Pillow>=11.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
